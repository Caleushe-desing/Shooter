<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>AIM 3P — Laboratorio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="crosshair" aria-hidden="true">
        <span class="ch h"></span>
        <span class="ch v"></span>
        <span class="ch d"></span>
      </div>
      <div id="hud" hidden>
        <div class="hud-top">
          <div><label>PUNTOS</label><b id="score">0</b></div>
          <div><label>TIEMPO</label><b id="time">60.0</b></div>
          <div><label>PREC.</label><b id="acc">100%</b></div>
          <div><label>MODO</label><b id="mode-tag">GRID</b></div>
        </div>
        <div class="hud-hint" id="hint">WASD mover · mouse mirar · click disparar</div>
      </div>
      <div id="menu">
        <p class="kicker">TERCERA PERSONA</p>
        <h1>AIM 3P</h1>
        <p class="sub">Laboratorio de puntería · estilo Aim Lab</p>
        <div class="modes">
          <button data-mode="grid" type="button">
            <strong>GRIDSHOT</strong>
            <span>3 orbes. Flick rápido.</span>
          </button>
          <button data-mode="flick" type="button">
            <strong>FLICK</strong>
            <span>1 orbe. Salta lejos.</span>
          </button>
          <button data-mode="track" type="button">
            <strong>TRACKING</strong>
            <span>Seguí el orbe en movimiento.</span>
          </button>
        </div>
        <p class="foot">PC: click para mirar · Celular: stick + arrastrá + DISPARO</p>
      </div>
      <div id="results" hidden>
        <h2>SESIÓN</h2>
        <ul>
          <li>Puntos <b id="r-score">0</b></li>
          <li>Precisión <b id="r-acc">0%</b></li>
          <li>Aciertos <b id="r-hits">0</b></li>
          <li>Disparos <b id="r-shots">0</b></li>
        </ul>
        <button id="again" type="button">OTRA VEZ</button>
        <button id="back" type="button">MENÚ</button>
      </div>
      <div id="mobile" hidden>
        <div id="stick">
          <div id="knob"></div>
        </div>
        <button id="fire" type="button">DISPARO</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
